<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}cheapabase + FastAPI{% endblock %}</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    input, textarea, button { font: inherit; padding: .4rem .6rem; }
    textarea { width: 100%; min-height: 16rem; box-sizing: border-box; }
    form { margin: 1rem 0; }
    .error { color: #b00020; }
    .muted { color: #666; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
