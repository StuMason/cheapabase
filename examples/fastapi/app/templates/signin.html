{% extends "base.html" %}
{% block body %}
<h1>cheapabase + FastAPI</h1>
<p class="muted">Sign up with any email, no confirmation needed.</p>
<form method="post" action="/signin">
  <p><input id="email" name="email" type="email" placeholder="Email" required autocomplete="email"></p>
  <p><input id="password" name="password" type="password" placeholder="Password" required minlength="6"></p>
  <button id="signin" type="submit">Sign in</button>
  <button id="signup" type="submit" formaction="/signup">Sign up</button>
</form>
<p id="error" class="error">{{ error or "" }}</p>
{% endblock %}
