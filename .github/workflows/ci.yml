name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  e2e:
    name: Docker build + end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - run: bun install --frozen-lockfile

      - name: API tests (supabase-js, RLS, functions, realtime)
        run: bun run test:e2e

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser test (docs app, two users)
        run: npm run test:ui

      - name: Stack logs
        if: failure()
        run: docker compose logs
